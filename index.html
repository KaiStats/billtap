<!doctype html>
<!--
  class="dark" is load-bearing, not a preference.

  Every page paints its own chrome with hard-coded dark hex (#0a0e1a, #111827),
  but the shadcn tokens in src/index.css only go dark under a `.dark` ancestor.
  Without it they fell back to the light theme, so --foreground resolved to
  0 0% 3.9% — near-black type on a near-black background. Scanned receipt items,
  their prices, the bill title: all rendering, none readable. Placeholders looked
  brighter than real values, because those use --muted-foreground at 45% grey.

  There is no light theme to fall back to; the design is dark-only. Removing
  this does not offer a choice, it just makes the text invisible again.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      frame-ancestors is deliberately absent: browsers ignore it when delivered
      via <meta> and log a warning. Clickjacking protection is enforced by the
      X-Frame-Options header the Worker sets on every HTML response
      (see HTML_SECURITY_HEADERS in worker/index.js).
    -->
    <!--
      worker-src allows blob: because Sentry Session Replay compresses recordings
      in a worker it creates from a Blob. Without the directive that falls back
      to script-src, which has no blob:, and the browser refuses the worker —
      replay then degrades to compressing on the main thread.
    -->
    <!--
      Four directives added, none of which default-src covers.

      base-uri is the one that matters most here. It does NOT fall back to
      default-src, so without it a single injected <base href="//evil.example/">
      silently repoints every relative URL on the page — including the module
      scripts in /assets/ — at an attacker's origin, and script-src 'self' still
      passes because the browser resolves 'self' against the *base*, not the
      document. It is the cheapest way to turn one injected tag into full script
      execution, and it was open.

      form-action likewise does not inherit from default-src: it is what stops
      an injected <form> from posting the sign-in fields to somebody else.

      object-src 'none' retires <object>/<embed>/<applet>, a plugin surface this
      app has no use for and which historically bypassed script-src.

      frame-src 'none' is explicit rather than inherited so that adding an
      embed later is a decision somebody makes, not something that quietly
      starts working.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-src 'none'; script-src 'self' https://connect.facebook.net https://www.googletagmanager.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!--
      X-XSS-Protection was here, set to "1; mode=block".

      Removed rather than corrected. The header drives a reflected-XSS auditor
      that Chrome deleted in 2019, Edge dropped when it moved to Chromium, and
      Firefox never shipped — so on every browser this app actually runs in it
      is inert. In the browsers that did honour it, mode=block was itself an
      information-disclosure vector (it let an attacker selectively blank parts
      of a cross-origin page to probe its contents), which is precisely why it
      was removed upstream.

      The CSP above is the real defence. Keeping a dead header alongside it only
      makes a scanner report look longer than the protection is.
    -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!--
      Permissions-Policy is NOT here, for the same reason frame-ancestors is
      not: browsers only parse it as a response header, so the <meta> version
      that used to sit on this line was inert on every request ever served. It
      now lives in HTML_SECURITY_HEADERS in worker/index.js, where it applies.
    -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      Fonts for the whole app in one request.

      These used to live in @import rules inside each page's <style> block, which
      meant the browser could not even discover them until React had mounted and
      painted — the worst possible time for the font that renders the headline.
      Declared here they start downloading alongside the JS.

      Listing every family costs one small CSS file; the woff2 binaries are only
      fetched for families a page actually uses, so pages on Space Grotesk pay
      nothing for Instrument Serif.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded async, not as a plain stylesheet. A render-blocking stylesheet on a
      third-party origin means the page cannot paint at all when that origin is
      slow, firewalled or unreachable — measured here as a 376ms first paint
      becoming 13s. preload fetches it at high priority without blocking, the
      onload promotes it to a stylesheet, and display=swap paints the fallback
      face immediately either way. <noscript> covers scripting-off clients.
    -->
    <link
      rel="preload"
      as="style"
      data-fonts
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <!--
      The onload="this.rel='stylesheet'" that used to sit on the link above is
      an inline event handler, and a CSP without script-src 'unsafe-inline'
      blocks those exactly as it blocks inline <script>. Dropping that token —
      the point of moving the analytics tags to /analytics.js — would have
      stopped the fonts being applied at all, silently: the preload still
      fetches, the page still renders, every headline just falls back forever.

      public/fonts.js does the same job from a file this origin serves.
    -->
    <script defer src="/fonts.js"></script>
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!--
      There was a `<link rel="preconnect" crossorigin>` to a Higgsfield
      CloudFront distribution here, with the note "/restaurants loads 15 frames
      from this origin". It does not, and has not since SELF_HOSTED was flipped
      in src/lib/restaurant-assets.js and src/lib/landing-assets.js — every
      frame on both pages is re-encoded WebP served from /img/, on this origin,
      under the cache rule in public/_headers.

      A preconnect is neither free nor lazy: the browser opens DNS, TCP and TLS
      to that host immediately, at the top of the document, competing with the
      requests that are actually on the critical path. Warming a connection
      nothing uses spends a diner's first round trips on a third party, and
      tells that third party the page was loaded.

      Nothing is preconnected in its place, deliberately. Everything the first
      paint needs — the shell, the bundles, /fonts.js, the art — is same-origin,
      and that connection is already open by the time this line is parsed.
      src/caching.test.mjs keeps it that way.
    -->
    <title>BillTap — Split Bills in 30 Seconds</title>
    <meta name="description" content="BillTap lets you split restaurant bills instantly. Scan a receipt, share a QR code, everyone pays their exact share. No math, no IOUs." />
    <!--
      Defaults only. Each route overwrites title/description/canonical/OG via
      src/components/Seo.jsx once React mounts; these are what a scraper that
      does not run JS will read.
    -->
    <link rel="canonical" href="https://billtap.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BillTap" />
    <meta property="og:title" content="BillTap — Split Bills in 30 Seconds" />
    <meta property="og:description" content="Scan the receipt, share a QR code, everyone pays their exact share. No app, no accounts, no math." />
    <meta property="og:url" content="https://billtap.app/" />
    <meta property="og:image" content="https://billtap.app/img/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://billtap.app/img/og-default.png" />
    <!--
      Analytics, in one external file.
      https://billtap.app/analytics.js — see public/analytics.js.

      These were two inline <script> blocks, and they were the only reason the
      Content-Security-Policy above carried script-src 'unsafe-inline'. That one
      token means any injected script in this page executes, which undoes most
      of what the policy is for. A file from this origin needs only 'self'.

      defer, because neither vendor needs to run before the page paints.
    -->
    <!--
      Organization schema. Lives here rather than in Seo.jsx: every route
      shares this one HTML file, the data never changes per-route, and a
      crawler that never executes JS still needs to see it — same reasoning
      already applied above to the default title/description/OG tags.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BillTap",
      "url": "https://billtap.app",
      "logo": "https://billtap.app/icons/icon-192.png",
      "email": "hello@billtap.app"
    }
    </script>
    <script defer src="/analytics.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
