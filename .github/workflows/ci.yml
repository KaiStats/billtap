name: CI

# Runs the checks that already exist but nothing was running automatically.
#
# There are 526 tests in this repo, including the ones covering the
# concurrent-claim race in joinSession — two diners claiming at the same table,
# where the loser used to be erased from the split entirely. Nothing ran them on
# push, so a change that broke the money maths would have shipped and been
# discovered by a restaurant.
#
# (That count said 27 for a long while after it stopped being true. It is a
# number in a comment, so it will drift again; what it is there to convey is
# that this suite is the money code's only automated defence, and that has not
# changed.)
#
# Deliberately not a deploy gate — deploys are a person running `npm run deploy`
# — and it is not, on its own, a merge gate either. Nothing here can stop a
# commit reaching main while the branch is unprotected; see the note at the
# bottom of this file.

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege for GITHUB_TOKEN.
#
# With no permissions block the token gets whatever the repository default is,
# which for older repositories is read AND write on everything. This workflow
# runs `npm ci`, which executes install scripts from every package in the tree —
# esbuild and friends need them — so an npm supply-chain compromise gets a shell
# in this job. Whether that shell also gets a token that can push to main and
# rewrite this workflow should not be left to a repository setting nobody has
# looked at.
#
# Nothing here writes to GitHub. Reading the code is the whole job.
permissions:
  contents: read

# One run per branch, across both triggers.
#
# The job installs Chromium and drives a browser suite, so a run is minutes of
# compute. Two things were spending it twice over: a push while the previous
# run was still going, and the fact that this workflow fires on `push` AND on
# `pull_request` — so every commit to a branch with a PR open ran the whole
# suite twice, on the same code, for the same answer.
#
# Keying the group on the head branch rather than github.ref puts both triggers
# in one group, so the pair collapses to a single run. `push` stays as a trigger
# because it is what gives feedback on a branch before anyone opens a PR.
#
# Not cancelled on the default branch: there, every commit's result is worth
# having, because main is what people go back and look at when something broke.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pinned to a commit, not a tag.
      #
      # `@v4` is a tag the action's own maintainers move, so what runs here is
      # whatever they last pointed it at — and anyone who takes over that
      # repository inherits the ability to change what executes in this job,
      # retroactively, in every workflow that trusts the tag. A commit sha
      # cannot be moved.
      #
      # These are v4.4.0 of each action, resolved from the tag at the time of
      # writing and verified to match what `refs/tags/v4` pointed at. Update
      # them the way any other dependency is updated: deliberately, with the
      # version written next to the sha so the next person can tell what they
      # are looking at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # `npm ci` rather than `install`: it honours the lockfile exactly, so CI
      # tests the dependency tree that actually ships.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Unit only. `npm test` now runs the browser suite too, and Chromium is
      # not installed until further down — running it here would fail for a
      # reason that has nothing to do with the code.
      - name: Test
        run: npm run test:unit

      # The build has caught real breakage that lint and tests do not: a bad
      # import, a syntax error in a page that no test imports.
      - name: Build
        run: npm run build

      # wrangler had been warning, on every dry run, that `--env staging`
      # inherits the top-level routes and would reassign billtap.app away from
      # the production Worker — and that the vars the environment isolation
      # check depends on are not inherited, so that check could not run. Both
      # were true, both were printed, and wrangler exits 0 while saying so.
      #
      # After Build, because a dry run resolves the assets directory and runs
      # build.command, which verifies dist/.
      - name: Check wrangler environments
        run: node scripts/check-wrangler.mjs

      # Every /img/ and /video/ URL the build references must exist. This is the
      # check that catches the class of bug where landing-assets.js advertised a
      # 2560px hero variant that was never generated — invisible on an ordinary
      # display, and the hero art silently vanished on Retina screens.
      #
      # Prerendering needs a real browser, which is a slow download, so CI skips
      # it and verify-dist is told to expect that. The full gate still runs on
      # every actual deploy via wrangler's build.command.
      - name: Verify referenced assets exist
        run: node scripts/verify-dist.mjs --assets-only

      # The browser suite drives the built bundle through the guest journey —
      # scan, review, correct, share — with the network stubbed. It is the only
      # thing here that checks what a diner actually sees: that the total on
      # screen is the total sent to the server, that nothing spills off a 390px
      # phone, that the receipt is readable rather than near-black on black.
      #
      # It needs Chromium, which is why it is installed here rather than assumed.
      #
      # It used to be excluded from `npm test` so the fast path stayed fast. That
      # cost more than it saved: fifteen browser tests broke across two commits
      # and nothing local said so, because `npm test` reported 422 passing and
      # the suite that would have caught it was a separate command nobody ran.
      # CI did catch it, on every commit for days, and nobody looked. `npm test`
      # runs both now.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds its own bundle with fixed configuration — see
      # scripts/build-for-tests.mjs. It used to run against whatever dist/ the
      # previous step left, built from whatever .env.local existed, which is why
      # this suite passed on a laptop and failed here on the same commit for
      # days running.
      - name: Browser tests
        run: npm run test:ui

# ── What this workflow cannot do ────────────────────────────────────────────
#
# `main` is unprotected. Confirmed against the GitHub API, not assumed:
#
#     GET /repos/kaistats/billtap/branches → main: "protected": false
#
# So every check above is advisory. A commit can be pushed straight to main, or
# a pull request merged with this workflow red, and nothing stops either. The
# suite that covers the concurrent-claim race and the participant-key
# authorisation would run, fail, and be merged past.
#
# The fix is a repository setting, not a file, which is why it is written here
# rather than fixed here. In Settings → Branches, add a rule for `main`:
#
#   * Require a pull request before merging
#   * Require status checks to pass — select this workflow's "test" job
#   * Require branches to be up to date before merging
#   * Do not allow force pushes, and do not allow deletions
#
# Until that exists, treat a green tick here as information rather than as a
# gate. The header at the top of this file says the same thing about deploys,
# and it has been true of merges as well the whole time.
